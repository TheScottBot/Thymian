[versions]
# Versions read from source on 22 November 2026; see docs/evaluation/ACTUAL_CONTRACT_EVALUATION.md 3.2.
android-gradle-plugin = "9.5.1"
kotlin = "2.4.21"
junit = "6.1.3"
ktlint = "1.8.0"
kotlinx-serialization = "1.13.0"
# The sdk-common release AGP 9.5.1 itself depends on; used only by the icon conversion tool.
android-sdk-common = "32.5.1"
androidx-test = "1.7.0"
androidx-work = "2.12.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
android-sdk-common = { module = "com.android.tools:sdk-common", version.ref = "android-sdk-common" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-lint = { id = "com.android.lint", version.ref = "android-gradle-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
