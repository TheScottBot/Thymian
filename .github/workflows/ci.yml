# Runs on every push and pull request (specification 2.6, CWD10): every unit
# test, Android lint and ktlint with warnings as errors, the typography check,
# and a debug APK kept as a workflow artefact. It never sees the release
# keystore or its passwords, so it cannot build or sign a release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit hashes so a moved tag cannot change what runs.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK 25 matches the Mac build; ktlint's JVM flag needs JDK 24 or later.
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install the Android SDK packages the build needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      # Also verifies the Gradle wrapper jar against Gradle's published checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          # The default 'enhanced' cache is a proprietary component; 'basic' is the MIT licensed one.
          cache-provider: basic

      - name: Run every check and build the debug APK
        run: ./gradlew check assembleDebug

      - name: Keep the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thymian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
